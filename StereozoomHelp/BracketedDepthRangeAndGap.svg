<text x="54" y="340" font-size="15" fill="#222"><tspan font-weight="700">Shoulder buttons (W / E):</tspan> slide the whole pair. The starting location changes; the gap stays the same.</text>
<text x="54" y="368" font-size="15" fill="#222"><tspan font-weight="700">DPad Left / Right (D / F):</tspan> move the right-eye image. The gap, and the depth, shrinks or grows.</text>
<text x="54" y="396" font-size="15" fill="#222"><tspan font-weight="700">A larger gap means more depth,</tspan> but less overlap between the two images.</text>
